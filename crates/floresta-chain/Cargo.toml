[package]
name = "floresta-chain"
version = "0.6.0"
rust-version.workspace = true
edition.workspace = true
authors = ["Floresta Developers <contact@getfloresta.org>"]
description = """
    Reusable components for building consensus-critical Bitcoin applications.
    Using floresta-chain, you can create a Bitcoin node that validates blocks
    and transactions, according to the Bitcoin consensus rules.
"""
repository = "https://github.com/getfloresta/Floresta"
license.workspace = true
readme.workspace = true # Floresta/README.md
keywords = ["bitcoin", "utreexo", "node", "consensus"]
categories = ["cryptography::cryptocurrencies", "database"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# All dependencies MUST be pinned precisely with `X.Y.z`
bitcoin = { workspace = true }
bitcoin_hashes = { workspace = true }
bitcoinkernel = { version = "=0.3.0", optional = true }
lru = { version = "=0.18.2", optional = true }
memmap2 = { version = "=0.9.11", optional = true }
# Not `workspace = true`, as `floresta-common` below: the workspace takes their default
# features (`std`), which a member cannot turn off; the `std` feature enables them.
rustreexo = { version = "=0.7.0", default-features = false }
serde = { workspace = true, optional = true }
spin = { workspace = true }
tracing = { workspace = true }
twox-hash = { version = "=2.1.2", default-features = false, features = ["xxhash3_64", "std"], optional = true }

# Local dependencies
floresta-common = { version = "=1.0.0", default-features = false }
floresta-metrics = { workspace = true, optional = true }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
bitcoin_hashes = { workspace = true, features = ["cpufeatures"] }

[dev-dependencies]
# The tests use `std`, also when the crate is built without it
bitcoin = { workspace = true, features = ["serde", "std"] }
floresta-common = { version = "=1.0.0", features = ["std"] }
rustreexo = { version = "=0.7.0", features = ["std"] }
criterion = { version = "=0.7.0" }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
zstd = { workspace = true }

[features]
default = ["std"]
std = ["bitcoin/std", "floresta-common/std", "rustreexo/std"]
bitcoinkernel = ["std", "dep:bitcoinkernel"]
metrics = ["std", "dep:floresta-metrics"]
test-utils = ["dep:serde"]
flat-chainstore = ["std", "dep:memmap2", "dep:lru", "dep:twox-hash"]

[[bench]]
name = "chain_state_bench"
harness = false
required-features = ["flat-chainstore", "test-utils"]

[lints]
workspace = true
